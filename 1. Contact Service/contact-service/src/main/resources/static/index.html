<!-- Desc: UI for contact service | Author: Sebastian Stohn | Date: 2026-08-03 -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Contact Service</title>
        <link rel="stylesheet" href="styles.css">
		<script src="index.js" defer></script>
    </head>
    <body>
        <nav>										<!-- Title bar -->
			<p>Contact Service</p>
        </nav>
        <main class="content">
            <p>										<!-- Contact form -->
				<label for="contactId">ID: </label>
				<input type="text" name="contactId" id="contactId" placeholder="10 characters or less">
				<br>
				<label for="contactFirst">First Name: </label>
				<input type="text" name="contactFirst" id="contactFirst" placeholder="10 characters or less">
				<br>
				<label for="contactLast">Last Name: </label>
				<input type="text" name="contactLast" id="contactLast" placeholder="10 characters or less">
				<br>
				<label for="contactPhone">Phone: </label>
				<input type="text" name="contactPhone" id="contactPhone" placeholder="10 digits no puctuation">
				<br>
				<label for="contactAddress">Address: </label>
				<input type="text" name="contactAddress" id="contactAddress" placeholder="30 characters or less">
				<br>
				<button onclick="addContact()">Add Contact</button>
			</p>
			<p>										<!-- Find contact form -->
				<label for="findContact">Find by ID: </label>
				<input type="text" name="findContact" id="findContact">
				<br>
				<button onclick="findContact()">Find Contact</button>
			</p>
			<p>										<!-- Working contact label -->
				<b>Current Contact Information:</b>
			</p>
			<div id="result">None</div>
			<p id="hidden" style="display: none">	<!-- Update contact forms -->
				<label for="editFirst">First Name: </label>
				<input type="text" name="editFirst" id="editFirst" placeholder="10 characters or less">
				<button onclick="updateFirstName()">Update</button>
				<br>
				<label for="editLast">Last Name: </label>
				<input type="text" name="editLast" id="editLast" placeholder="10 characters or less">
				<button onclick="updateLastName()">Update</button>
				<br>
				<label for="editPhone">Phone: </label>
				<input type="text" name="editPhone" id="editPhone" placeholder="10 digits no punctuation">
				<button onclick="updatePhone()">Update</button>
				<br>
				<label for="editAddress">Address: </label>
				<input type="text" name="editAddress" id="editAddress" placeholder="30 characters or less">
				<button onclick="updateAddress()">Update</button>
				<br>
				<br>								<!-- Delete button -->
				<button onclick="deleteContact()">Delete Contact</button>
			</p>
			<p>										<!-- Contact book display -->
				<button onclick="displayAllContacts()">Show All Contacts</button>
			</p>
			<span id="contactBook">Select show all contacts</span>
        </main>
    </body>
</html>
